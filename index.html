<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Seahunter — A fast-paced 2D side-scrolling underwater shooter built with vanilla JavaScript and HTML5 Canvas.">
    <title>Seahunter — 2D Underwater Shooter</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐠</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <canvas id="canvas1"></canvas>
    </main>

    <!-- characters -->
    <img id="player" src="assets/player.png" alt="player">
    <img id="angler1" src="assets/angler1.png" alt="angler1">
    <img id="angler2" src="assets/angler2.png" alt="angler2">
    <img id="lucky" src="assets/lucky.png" alt="lucky">
    <img id="hivewhale" src="assets/hivewhale.png" alt="hivewhale">
    <img id="drone" src="assets/drone.png" alt="drone">

    <!-- props -->
    <img id="projectile" src="assets/projectile.png" alt="projectile">
    <img id="gears" src="assets/gears.png" alt="gears">
    <img id="smokeExplosion" src="assets/smokeExplosion.png" alt="smoke explosion">
    <img id="fireExplosion" src="assets/fireExplosion.png" alt="fire explosion">

    <!-- environment setup -->
    <img id="layer1" src="assets/layer1.png" alt="background layer 1">
    <img id="layer2" src="assets/layer2.png" alt="background layer 2">
    <img id="layer3" src="assets/layer3.png" alt="background layer 3">
    <img id="layer4" src="assets/layer4.png" alt="foreground layer 4">

    <script src="script.js"></script>
</body>
</html>
