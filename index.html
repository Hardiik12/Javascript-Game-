<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Seahunter — A fast-paced 3D underwater shooter built with Three.js. Blast through waves of deep-sea creatures in stunning WebGL graphics.">
    <title>Seahunter — 3D Underwater Shooter</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐠</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="game-container">
        <!-- Three.js canvas is injected here -->
    </main>

    <!-- ── HUD Overlay ── -->
    <div id="hud">
        <div id="hud-panel">
            <div class="hud-row">
                <div class="hud-stat">
                    <span class="hud-label">SCORE</span>
                    <span class="hud-value" id="hud-score">0</span>
                </div>
                <div class="hud-stat">
                    <span class="hud-label">WAVE</span>
                    <span class="hud-value hud-wave" id="hud-wave">1</span>
                </div>
            </div>
            <div class="hud-bar-group">
                <span class="hud-bar-label">AMMO</span>
                <div class="hud-bar-bg">
                    <div class="hud-bar-fill" id="hud-ammo"></div>
                </div>
            </div>
        </div>
        <div id="hud-timer-wrap">
            <div class="hud-bar-bg hud-timer-bg">
                <div class="hud-bar-fill hud-timer-fill" id="hud-timer"></div>
            </div>
            <span id="hud-timer-text">30.0s</span>
        </div>
    </div>

    <!-- ── Game Over Overlay ── -->
    <div id="game-over-overlay" class="hidden">
        <div id="game-over-content">
            <h1 id="game-over-title">Blazes!</h1>
            <p id="game-over-subtitle">Better luck next time!</p>
            <p id="game-over-score">Final Score: 0</p>
            <p class="restart-prompt">[ Press ENTER to Play Again ]</p>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
